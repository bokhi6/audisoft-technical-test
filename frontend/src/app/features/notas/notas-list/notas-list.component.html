<div class="p-6 max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-semibold text-gray-800">Gestión de Notas</h1>
    <button mat-raised-button color="primary" (click)="abrirCrear()">
      <mat-icon>add</mat-icon>
      Crear nota
    </button>
  </div>

  <div class="bg-white rounded-lg shadow overflow-x-auto">
    <table mat-table [dataSource]="notas()" class="w-full">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Id</th>
        <td mat-cell *matCellDef="let nota">{{ nota.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let nota">{{ nota.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="estudiante">
        <th mat-header-cell *matHeaderCellDef>Estudiante</th>
        <td mat-cell *matCellDef="let nota">{{ nota.nombreEstudiante }}</td>
      </ng-container>

      <ng-container matColumnDef="profesor">
        <th mat-header-cell *matHeaderCellDef>Profesor</th>
        <td mat-cell *matCellDef="let nota">{{ nota.nombreProfesor }}</td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef>Valor</th>
        <td mat-cell *matCellDef="let nota">{{ nota.valor }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let nota">
          <button mat-icon-button color="primary" (click)="abrirEditar(nota)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="abrirEliminar(nota)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnasVisibles"></tr>
      <tr mat-row *matRowDef="let row; columns: columnasVisibles;"></tr>
    </table>

    @if (notas().length === 0) {
      <p class="text-center text-gray-500 py-8">No hay notas registradas.</p>
    }

    <mat-paginator
      [length]="totalCount()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[3, 5, 10]"
      [pageIndex]="pageIndex()"
      (page)="onPageChange($event)"
      aria-label="Seleccionar página de notas">
    </mat-paginator>
  </div>
</div>
