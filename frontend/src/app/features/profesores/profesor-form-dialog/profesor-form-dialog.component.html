<h2 mat-dialog-title>{{ tituloDialogo }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Nombre del profesor" autofocus>
      @if (form.controls.nombre.hasError('required')) {
        <mat-error>El nombre es obligatorio.</mat-error>
      }
      @if (form.controls.nombre.hasError('maxlength')) {
        <mat-error>El nombre no puede superar 200 caracteres.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialogRef.close()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
