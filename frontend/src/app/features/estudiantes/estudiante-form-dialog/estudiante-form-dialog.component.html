<div class="w-[440px] max-w-full">
  <div class="bg-gradient-to-r from-indigo-600 to-blue-600 px-6 py-5 flex items-center gap-4">
    <div class="w-12 h-12 rounded-full bg-white/15 text-white flex items-center justify-center text-lg font-bold shrink-0">
      {{ inicialesPreview }}
    </div>
    <div>
      <h2 class="text-white font-semibold text-lg leading-tight">{{ tituloDialogo }}</h2>
      <p class="text-indigo-100 text-xs">Registro de estudiante</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="px-6 py-6">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="estudiante-nombres" class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Nombres</label>
        <input
          id="estudiante-nombres"
          formControlName="nombres"
          placeholder="Ej. Juan Carlos"
          maxlength="100"
          class="w-full rounded-xl border px-3 py-2.5 text-sm text-slate-800 outline-none transition-colors focus:border-indigo-500"
          [class.border-slate-200]="!form.controls.nombres.touched || form.controls.nombres.valid"
          [class.border-rose-400]="form.controls.nombres.touched && form.controls.nombres.invalid">
        @if (form.controls.nombres.touched && form.controls.nombres.hasError('required')) {
          <span class="text-xs text-rose-500">Obligatorio.</span>
        }
      </div>

      <div>
        <label for="estudiante-apellidos" class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Apellidos</label>
        <input
          id="estudiante-apellidos"
          formControlName="apellidos"
          placeholder="Ej. Pérez Ramírez"
          maxlength="100"
          class="w-full rounded-xl border px-3 py-2.5 text-sm text-slate-800 outline-none transition-colors focus:border-indigo-500"
          [class.border-slate-200]="!form.controls.apellidos.touched || form.controls.apellidos.valid"
          [class.border-rose-400]="form.controls.apellidos.touched && form.controls.apellidos.invalid">
        @if (form.controls.apellidos.touched && form.controls.apellidos.hasError('required')) {
          <span class="text-xs text-rose-500">Obligatorio.</span>
        }
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button type="button" (click)="dialogRef.close()"
        class="px-4 py-2 rounded-full text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">
        Cancelar
      </button>
      <button type="submit"
        class="px-5 py-2 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-blue-600 shadow-md hover:shadow-lg hover:brightness-105 transition-all">
        Guardar
      </button>
    </div>
  </form>
</div>
