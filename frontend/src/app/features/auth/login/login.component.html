<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-800 via-indigo-700 to-blue-600 px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-gradient-to-r from-indigo-600 to-blue-600 px-6 py-6 text-center">
      <div class="w-12 h-12 mx-auto rounded-lg bg-white/15 flex items-center justify-center font-bold text-xl text-white mb-2">A</div>
      <h1 class="text-white font-semibold text-lg">AudiSoft</h1>
      <p class="text-indigo-100 text-xs">Sistema de Gestión Académica</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="ingresar()" class="px-6 py-6">
      <label for="login-usuario" class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1.5">
        Usuario
      </label>
      <input
        id="login-usuario"
        formControlName="nombreUsuario"
        placeholder="admin"
        maxlength="100"
        class="w-full rounded-xl border px-3 py-2.5 text-sm text-slate-800 outline-none transition-colors focus:border-indigo-500 mb-4"
        [class.border-slate-200]="!form.controls.nombreUsuario.touched || form.controls.nombreUsuario.valid"
        [class.border-rose-400]="form.controls.nombreUsuario.touched && form.controls.nombreUsuario.invalid">

      <label for="login-password" class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1.5">
        Contraseña
      </label>
      <input
        id="login-password"
        formControlName="password"
        type="password"
        placeholder="••••••••"
        class="w-full rounded-xl border px-3 py-2.5 text-sm text-slate-800 outline-none transition-colors focus:border-indigo-500"
        [class.border-slate-200]="!form.controls.password.touched || form.controls.password.valid"
        [class.border-rose-400]="form.controls.password.touched && form.controls.password.invalid">

      <button type="submit" [disabled]="cargando()"
        class="w-full mt-6 py-2.5 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-blue-600 shadow-md hover:shadow-lg hover:brightness-105 transition-all disabled:opacity-60">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
